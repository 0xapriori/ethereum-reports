<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Noise filter for texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Distortion filter for hyperreality -->
    <filter id="distort">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.02" numOctaves="2" seed="5" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Mask fade -->
    <radialGradient id="centerFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <!-- Pillar gradients -->
    <linearGradient id="pillar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pillar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6633" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6633" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pillar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffcc33" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffcc33" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pillar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#33ccff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#33ccff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pillar5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cc33ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc33ff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Signal line gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff3366" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffcc33" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#cc33ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#cc33ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid suggesting structure/system -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Five pillars - abstract columns rising from bottom, slightly distorted -->
  <g filter="url(#distort)">
    <!-- CT -->
    <rect x="120" y="180" width="80" height="450" fill="url(#pillar1)" rx="2"/>
    <!-- Conference -->
    <rect x="320" y="220" width="80" height="410" fill="url(#pillar2)" rx="2"/>
    <!-- Podcast -->
    <rect x="520" y="160" width="80" height="470" fill="url(#pillar3)" rx="2"/>
    <!-- Crypto Media -->
    <rect x="720" y="240" width="80" height="390" fill="url(#pillar4)" rx="2"/>
    <!-- Research -->
    <rect x="920" y="200" width="80" height="430" fill="url(#pillar5)" rx="2"/>
  </g>

  <!-- Feedback loop - circular arrows connecting pillars -->
  <g fill="none" stroke="url(#signalGrad)" stroke-width="1.5" opacity="0.5">
    <path d="M 200 350 C 300 280, 350 280, 400 330"/>
    <path d="M 400 330 C 480 380, 500 290, 560 320"/>
    <path d="M 600 320 C 680 270, 700 350, 760 340"/>
    <path d="M 800 340 C 860 300, 900 280, 960 310"/>
    <!-- Return loop underneath -->
    <path d="M 960 380 C 900 450, 700 480, 560 460 C 400 440, 250 470, 160 400" stroke-dasharray="4 6" opacity="0.3"/>
  </g>

  <!-- Second layer of loops - tighter, more frantic -->
  <g fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <path d="M 160 300 Q 360 200 560 300 Q 760 400 960 300"/>
    <path d="M 160 360 Q 360 460 560 360 Q 760 260 960 360"/>
    <path d="M 160 330 Q 560 180 960 330"/>
  </g>

  <!-- Central eye shape - the "Eyes Wide" motif -->
  <g transform="translate(600, 290)">
    <!-- Outer eye -->
    <path d="M -180 0 Q -90 -80 0 -85 Q 90 -80 180 0 Q 90 80 0 85 Q -90 80 -180 0 Z"
          fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
    <!-- Inner eye -->
    <path d="M -120 0 Q -60 -50 0 -55 Q 60 -50 120 0 Q 60 50 0 55 Q -60 50 -120 0 Z"
          fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <!-- Pupil - but fragmented/broken -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff3366" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 4 2 4"/>
    <circle cx="0" cy="0" r="12" fill="#ff3366" opacity="0.15"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.3"/>

    <!-- Cracks through the eye - reality breaking through -->
    <line x1="-30" y1="-20" x2="25" y2="30" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    <line x1="15" y1="-25" x2="-20" y2="20" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- Scattered signal dots - some bright (real), most dim (noise) -->
  <g>
    <!-- Noise dots -->
    <circle cx="150" cy="250" r="2" fill="#ff3366" opacity="0.2"/>
    <circle cx="230" cy="310" r="1.5" fill="#ff6633" opacity="0.15"/>
    <circle cx="180" cy="400" r="1" fill="#ff3366" opacity="0.25"/>
    <circle cx="350" cy="280" r="2" fill="#ff6633" opacity="0.2"/>
    <circle cx="420" cy="370" r="1.5" fill="#ffcc33" opacity="0.15"/>
    <circle cx="380" cy="450" r="1" fill="#ff6633" opacity="0.2"/>
    <circle cx="550" cy="230" r="2" fill="#ffcc33" opacity="0.25"/>
    <circle cx="630" cy="400" r="1.5" fill="#ffcc33" opacity="0.15"/>
    <circle cx="580" cy="480" r="1" fill="#33ccff" opacity="0.2"/>
    <circle cx="750" cy="300" r="2" fill="#33ccff" opacity="0.2"/>
    <circle cx="830" cy="380" r="1.5" fill="#cc33ff" opacity="0.15"/>
    <circle cx="780" cy="460" r="1" fill="#33ccff" opacity="0.25"/>
    <circle cx="950" cy="270" r="2" fill="#cc33ff" opacity="0.2"/>
    <circle cx="1030" cy="350" r="1.5" fill="#cc33ff" opacity="0.15"/>
    <circle cx="980" cy="440" r="1" fill="#cc33ff" opacity="0.2"/>

    <!-- Rare signal dots - brighter -->
    <circle cx="560" cy="310" r="3" fill="#ffffff" opacity="0.5" filter="url(#glow)"/>
    <circle cx="285" cy="420" r="2.5" fill="#ffffff" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- Mask shapes overlaying - layers of performance -->
  <g opacity="0.08" fill="none" stroke="#ffffff" stroke-width="0.75">
    <!-- Abstract mask outlines scattered -->
    <ellipse cx="250" cy="200" rx="35" ry="45" transform="rotate(-10 250 200)"/>
    <ellipse cx="850" cy="180" rx="30" ry="40" transform="rotate(8 850 180)"/>
    <ellipse cx="1050" cy="250" r="25" ry="35"/>
    <ellipse cx="100" cy="350" rx="28" ry="38" transform="rotate(-5 100 350)"/>
  </g>

  <!-- Bottom fade - the desert of the real -->
  <rect x="0" y="500" width="1200" height="130" fill="url(#bg)" opacity="0.7"/>

  <!-- Thin horizontal line separating hyperreality from reality -->
  <line x1="100" y1="530" x2="1100" y2="530" stroke="#ffffff" stroke-width="0.5" opacity="0.1" stroke-dasharray="2 8"/>

  <!-- "Reality" below the line - sparse, dim -->
  <g opacity="0.06">
    <rect x="300" y="550" width="40" height="3" fill="#ffffff"/>
    <rect x="500" y="560" width="25" height="2" fill="#ffffff"/>
    <rect x="700" y="555" width="35" height="2" fill="#ffffff"/>
    <rect x="900" y="550" width="20" height="3" fill="#ffffff"/>
  </g>
</svg>
